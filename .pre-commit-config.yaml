# .pre-commit-config.yaml
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        name: "🔒 security · Detect hardcoded secrets"

  # Python: Ruff does EVERYTHING (format + lint + naming)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      # Lint first (includes naming, docstrings, everything)
      - id: ruff
        name: "🐍 python · Lint with Ruff (ALL rules)"
        args: [ --fix ]
        exclude: ^whitelist\.py$  # Vulture whitelist file
      # Format after linting
      - id: ruff-format
        name: "🐍 python · Format with Ruff"
        exclude: ^whitelist\.py$  # Vulture whitelist file

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

#  - repo: https://github.com/codespell-project/codespell
#    rev: v2.2.5
#    hooks:
#      - id: codespell
#        files: ^.*\.(py|c|h|md|rst|yml)$
#        args: ["--skip", "*.git,*.pyc,node_modules,build,dist,site"]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.11
    hooks:
      # Update the uv lockfile
      - id: uv-lock

